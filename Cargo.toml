[package]
name = "pass-sworm"
version = "0.1.0"
edition = "2024"
description = "TUI password manager with an encrypted vault and mesh sync"
license = "MIT"

[dependencies]
anyhow = "1"
argon2 = "0.5"
arboard = "3"
blake3 = "1"
chacha20poly1305 = "0.10"
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "5"
fs4 = "0.12"
futures = "0.3"
fuzzy-matcher = "0.3"
rand = "0.8"
ratatui = "0.29"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
subtle = "2"
thiserror = "2"
toml = "1.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
uuid = { version = "1", features = ["v7", "serde"] }
zeroize = { version = "1", features = ["derive"] }
iroh = "1.5.0"
iroh-mdns-address-lookup = "0.6.1"
iroh-mainline-address-lookup = "0.6.1"

[profile.release]
lto = "thin"
strip = true
